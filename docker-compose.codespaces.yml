services:
  postgres:
    image: postgres:16-alpine
    container_name: mustashark-codespaces-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mustashark_dev
      POSTGRES_USER: mustashark
      POSTGRES_PASSWORD: mustashark_dev
    ports:
      - "5432:5432"
    volumes:
      - mustashark-codespaces-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mustashark -d mustashark_dev"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  mustashark-codespaces-pgdata:
