name: Phase D Notifications Adversarial Proof

on:
  workflow_dispatch:
  push:
    branches:
      - "security/api-context-phase-a-2026-09-05"
  pull_request:
    branches:
      - "main"

jobs:
  phase-d-adversarial:
    name: Phase D notifications adversarial proof
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mustashark_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mustashark_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mustashark_test
      PNPM_CONFIG_AUTO_INSTALL_PEERS: "false"
      SESSION_SECRET: phase-d-isolated-test-session-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Assert pnpm lockfile configuration
        run: |
          test "$(pnpm config get autoInstallPeers)" = "false"
          grep -A2 '^settings:' pnpm-lock.yaml | grep -q 'autoInstallPeers: false'

      # Security: only esbuild is allowlisted for dependency build scripts.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Guard against production database
        run: |
          test "$DATABASE_URL" = "postgresql://postgres:postgres@localhost:5432/mustashark_test"
          ! printf '%s' "$DATABASE_URL" | grep -Eqi 'supabase|mustashark-beta|mustashark-production|db\.[a-z0-9]+\.supabase\.co'

      - name: Provision isolated test schema
        run: pnpm --filter @workspace/db push

      - name: Assert isolated database identity
        run: |
          test "$(psql "$DATABASE_URL" -Atqc 'select current_database()')" = "mustashark_test"
          test "$(psql "$DATABASE_URL" -Atqc 'select current_schema()')" = "public"

      - name: Build referenced workspace declarations
        run: pnpm exec tsc -b lib/db lib/api-zod

      - name: Run Phase D adversarial HTTP proof
        working-directory: artifacts/api-server
        run: pnpm exec tsx --test src/security/phaseD.notifications.adversarial.test.ts

      - name: Typecheck API server
        working-directory: artifacts/api-server
        run: pnpm typecheck
