name: T02-01 Data Foundation Gate

on:
  push:
    branches:
      - feat/t02-01-data-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  data-foundation:
    name: T02-01 isolated PostgreSQL Data Foundation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mustashark_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mustashark_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mustashark_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Production DB guard
        run: |
          test "$DATABASE_URL" = "postgresql://postgres:postgres@localhost:5432/mustashark_test"
          case "$DATABASE_URL" in
            *supabase*|*pooler*|*production*) echo "Production DB guard: FAIL"; exit 1 ;;
          esac
          echo "Production DB guard: PASS"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch main baseline schema
        run: |
          git fetch origin main --depth=1
          git show origin/main:lib/db/src/schema/index.ts > lib/db/src/schema/t02-ci-base-index.ts
          cat > lib/db/t02-ci-drizzle.config.ts <<'EOF'
          import { defineConfig } from "drizzle-kit";
          import path from "path";

          if (!process.env.DATABASE_URL) {
            throw new Error("DATABASE_URL is required");
          }

          export default defineConfig({
            schema: path.join(__dirname, "./src/schema/t02-ci-base-index.ts"),
            dialect: "postgresql",
            dbCredentials: { url: process.env.DATABASE_URL },
          });
          EOF

      - name: Provision baseline main schema in isolated DB
        run: pnpm --filter @workspace/db exec drizzle-kit push --config ./t02-ci-drizzle.config.ts

      - name: Apply T02-01 migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f lib/db/migrations/0015_t02_01_dispute_data_foundation.sql

      - name: Verify T02-01 database foundation
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db-verification/verify-t02-01-data-foundation.sql

      - name: Typecheck database libraries
        run: pnpm run typecheck:libs

      - name: T02-01 gate result
        run: echo "T02-01 — DATA FOUNDATION GATE PASS"
