name: "Gate #2 Financial Validation"

on:
  push:
    branches:
      - security/gate-2-financial-guards
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  financial-integration-concurrency:
    name: Financial Integration & Concurrency Tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mustashark_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mustashark_test"
          --health-interval 2s --health-timeout 2s --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Provision isolated PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mustashark_test
        run: pnpm --filter @workspace/db push
      - name: Provision canonical admin identity in isolated DB
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mustashark_test
        run: pnpm --filter @workspace/scripts seed-admin
      - name: Build API server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mustashark_test
        run: pnpm --filter @workspace/api-server build
      - name: Start API server with demo auth disabled
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mustashark_test
          NODE_ENV: production
          MUSTASHAREK_DEMO_AUTH_ENABLED: "false"
          PORT: "8081"
          SESSION_SECRET: gate-2-financial-validation-secret
        run: |
          pnpm --filter @workspace/api-server start > /tmp/gate-2-api.log 2>&1 &
          echo $! > /tmp/gate-2-api.pid
      - name: Wait for API health
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8081/api/healthz >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/gate-2-api.log
          exit 1
      - name: Run Gate #2 Auth Provenance Lock
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mustashark_test
          GATE_2_BASE_URL: http://127.0.0.1:8081
          GATE_2_CLIENT_EMAIL: client@mustashark.com
          GATE_2_CLIENT_PASSWORD: Gate2RealAuth!2026
          GATE_2_LAWYER_EMAIL: lawyer@mustashark.com
          GATE_2_LAWYER_PASSWORD: Gate2RealAuth!2026
          MUSTASHAREK_DEMO_AUTH_ENABLED: "false"
        run: pnpm --filter @workspace/scripts exec tsx ./src/gate-2-auth-provenance-lock-test.ts
      - name: Run Gate #2 financial integration and concurrency tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mustashark_test
          GATE_2_BASE_URL: http://127.0.0.1:8081
          GATE_2_CLIENT_EMAIL: client@mustashark.com
          GATE_2_CLIENT_PASSWORD: Gate2RealAuth!2026
          GATE_2_LAWYER_EMAIL: lawyer@mustashark.com
          GATE_2_LAWYER_PASSWORD: Gate2RealAuth!2026
          MUSTASHAREK_DEMO_AUTH_ENABLED: "false"
        run: pnpm --filter @workspace/scripts gate-2:financial-concurrency
      - name: Dump API logs on failure
        if: failure()
        run: cat /tmp/gate-2-api.log
      - name: Stop API server
        if: always()
        run: |
          if [ -f /tmp/gate-2-api.pid ]; then kill "$(cat /tmp/gate-2-api.pid)" || true; fi
