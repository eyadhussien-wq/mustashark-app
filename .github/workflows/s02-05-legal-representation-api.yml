name: S02.5 Legal Representation Documents API Behavioral Test

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  api-behavioral:
    name: S02.5 live HTTP API behavioral test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mustashark_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mustashark_test"
          --health-interval 2s --health-timeout 2s --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Provision isolated test schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mustashark_test
        run: pnpm --filter @workspace/db push

      - name: Typecheck scripts and API
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mustashark_test
          SESSION_SECRET: s02-05-ci-api-test-secret
        run: |
          pnpm --filter @workspace/api-server typecheck
          pnpm --filter @workspace/scripts typecheck

      - name: Run live HTTP API behavioral test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mustashark_test
          SESSION_SECRET: s02-05-ci-api-test-secret
          NODE_ENV: test
        run: pnpm --filter @workspace/scripts s02-05:api
