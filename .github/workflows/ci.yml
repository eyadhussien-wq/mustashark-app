name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck workspace
        run: pnpm run typecheck
      - name: Build API server
        run: pnpm --filter @workspace/api-server build
      - name: Build admin dashboard
        run: pnpm --filter @workspace/admin-dashboard build
      - name: Verify Expo dependency alignment
        working-directory: artifacts/mustasharek
        continue-on-error: true
        run: pnpm exec expo install --check

  security-db-guard:
    name: Production DB guard (bash + ShellCheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Bash syntax
        run: bash -n scripts/security/forbid-production-db-mutations.sh
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run ShellCheck
        run: shellcheck scripts/security/forbid-production-db-mutations.sh
      - name: Run production DB mutation guard
        run: bash scripts/security/forbid-production-db-mutations.sh

  auth-smoke:
    name: Auth smoke tests (isolated PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mustashark_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mustashark_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Provision isolated test schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mustashark_test
        run: pnpm --filter @workspace/db push
      - name: Build API server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mustashark_test
        run: pnpm --filter @workspace/api-server build
      - name: Start API server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mustashark_test
          NODE_ENV: production
          MUSTASHAREK_DEMO_AUTH_ENABLED: "true"
          PORT: "8081"
          SESSION_SECRET: ci-auth-smoke-test-secret
        run: |
          pnpm --filter @workspace/api-server start > /tmp/mustashark-api.log 2>&1 &
          echo $! > /tmp/mustashark-api.pid
      - name: Wait for API health
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8081/api/healthz >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/mustashark-api.log
          exit 1
      - name: Run Auth smoke tests
        env:
          AUTH_BASE_URL: http://127.0.0.1:8081
        run: node scripts/auth-smoke-test.mjs
      - name: Dump API logs on failure
        if: failure()
        run: cat /tmp/mustashark-api.log
      - name: Stop API server
        if: always()
        run: |
          if [ -f /tmp/mustashark-api.pid ]; then kill "$(cat /tmp/mustashark-api.pid)" || true; fi

  concurrency-smoke:
