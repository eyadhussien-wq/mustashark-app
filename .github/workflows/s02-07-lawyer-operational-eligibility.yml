name: S02-07 Lawyer Operational Eligibility

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eligibility-matrix:
    name: Eligibility Matrix (isolated PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mustashark_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mustashark_test"
          --health-interval 2s --health-timeout 2s --health-retries 20

    env:
      ELIGIBILITY_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mustashark_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Provision isolated database
        env:
          DATABASE_URL: ${{ env.ELIGIBILITY_TEST_DATABASE_URL }}
        run: pnpm --filter @workspace/db push

      - name: Verify lawyer verification schema
        env:
          DATABASE_URL: ${{ env.ELIGIBILITY_TEST_DATABASE_URL }}
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT 1 FROM information_schema.tables WHERE table_name = 'lawyer_verifications';" | grep -q "1"

      - name: Run S02-07 Eligibility Matrix
        working-directory: artifacts/api-server
        env:
          ELIGIBILITY_TEST_DATABASE_URL: ${{ env.ELIGIBILITY_TEST_DATABASE_URL }}
        run: pnpm exec tsx --test src/services/lawyerEligibility.integration.test.ts

      - name: Print eligibility matrix on failure
        if: failure()
        run: |
          echo "Eligibility Matrix test failed. Database schema was isolated to the PostgreSQL service container."
