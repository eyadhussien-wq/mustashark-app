name: S01-03 migration rehearsal

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  migration-rehearsal:
    name: S01-03 upgrade rehearsal from pre-0009 schema
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mustashark_migration_rehearsal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mustashark_migration_rehearsal"
          --health-interval 2s --health-timeout 2s --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Provision current baseline schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mustashark_migration_rehearsal
        run: pnpm --filter @workspace/db push
      - name: Recreate pre-0009 state for S01-03 objects
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mustashark_migration_rehearsal
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DROP INDEX IF EXISTS idempotency_keys_request_uq;
          DROP INDEX IF EXISTS idempotency_keys_created_at_idx;
          DROP INDEX IF EXISTS idempotency_keys_expires_at_idx;
          DROP TABLE IF EXISTS idempotency_keys;
          ALTER TABLE bookings DROP COLUMN IF EXISTS version;
          SQL
      - name: Verify pre-S01-03 state
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mustashark_migration_rehearsal
        run: |
          set -euo pipefail
          test "$(psql "$DATABASE_URL" -Atq -c "SELECT count(*) FROM information_schema.columns WHERE table_name='bookings' AND column_name='version';")" = "0"
          test "$(psql "$DATABASE_URL" -Atq -c "SELECT count(*) FROM information_schema.tables WHERE table_name='idempotency_keys';")" = "0"
      - name: Apply S01-03 migration 0009
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mustashark_migration_rehearsal
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f lib/db/migrations/0009_s01_03_idempotency_and_booking_version.sql
      - name: Verify S01-03 upgrade
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mustashark_migration_rehearsal
        run: |
          set -euo pipefail
          test "$(psql "$DATABASE_URL" -Atq -c "SELECT data_type || '|' || column_default FROM information_schema.columns WHERE table_name='bookings' AND column_name='version';")" = "integer|1"
          test "$(psql "$DATABASE_URL" -Atq -c "SELECT count(*) FROM information_schema.tables WHERE table_name='idempotency_keys';")" = "1"
          test "$(psql "$DATABASE_URL" -Atq -c "SELECT count(*) FROM pg_indexes WHERE indexname='idempotency_keys_request_uq';")" = "1"
          echo "S01-03 MIGRATION REHEARSAL PASSED"
