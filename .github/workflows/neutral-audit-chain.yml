name: Neutral Audit Chain Verification Gate

on:
  push:
    branches: ["construction/lawyer-os-v1-p1-audit-2026-09"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  neutral-audit-chain:
    name: P3.1-H Audit Chain Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mustashark_neutral_audit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mustashark_neutral_audit_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mustashark_neutral_audit_test
      NODE_ENV: test
      NEUTRAL_CORE_COMMIT_SHA: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Guard against production database
        shell: bash
        run: |
          set -euo pipefail
          test "$DATABASE_URL" = "postgresql://postgres:postgres@localhost:5432/mustashark_neutral_audit_test"
          case "$DATABASE_URL" in
            *localhost:5432/mustashark_neutral_audit_test) ;;
            *) echo "ERROR: unexpected database target"; exit 1 ;;
          esac
          echo "Production database guard: PASS"

      - name: Provision isolated Neutral Core schema
        run: pnpm --filter @workspace/db exec drizzle-kit push --config ./drizzle.config.ts

      - name: Install database immutability trigger
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/security/install-neutral-audit-immutability.sql

      - name: Provision audit test actor
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "
            INSERT INTO users (id, name, email, role, auth_provider, account_status, litigation_tier, created_at, updated_at)
            VALUES ('ci-audit-lawyer', 'CI Audit Lawyer', 'ci-audit-lawyer@mustashark.com', 'lawyer', 'local', 'active', 'general', NOW(), NOW())
            ON CONFLICT (id) DO UPDATE SET role = 'lawyer', account_status = 'active', deleted_at = NULL, updated_at = NOW();
          "

      - name: Build API server
        run: pnpm --filter @workspace/api-server build

      - name: Run Chain Verification Smoke Test
        run: pnpm --filter @workspace/api-server exec tsx --test src/services/neutralAudit.chain.integration.test.ts

      - name: Final production DB guard
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test "$DATABASE_URL" = "postgresql://postgres:postgres@localhost:5432/mustashark_neutral_audit_test"
          echo "Final production database guard: PASS"
