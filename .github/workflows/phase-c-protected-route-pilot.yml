name: Phase C Protected Route Pilot

on:
  push:
    branches:
      - "security/api-context-phase-a-2026-09-05"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  protected-route-pilot:
    name: Phase C protected route pilot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mustashark_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mustashark_test"
          --health-interval 2s --health-timeout 2s --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Guard against production database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mustashark_test
        run: |
          case "$DATABASE_URL" in
            *supabase*|*mustashark-beta*|*mustashark-production*)
              echo "Production/Beta database reference detected" >&2
              exit 1
              ;;
          esac
          test "$DATABASE_URL" = "postgresql://postgres:postgres@localhost:5432/mustashark_test"
          echo "Isolated PostgreSQL database guard passed"

      - name: Provision isolated test schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mustashark_test
        run: pnpm --filter @workspace/db push

      - name: Assert isolated database identity
        env:
          PGPASSWORD: postgres
        run: |
          test "$(psql -h localhost -U postgres -d mustashark_test -Atqc 'select current_database()')" = "mustashark_test"
          test "$(psql -h localhost -U postgres -d mustashark_test -Atqc 'select current_schema()')" = "public"
          echo "Isolated PostgreSQL identity/schema assertion passed"

      - name: Build referenced workspace declarations
        run: pnpm exec tsc -b lib/db lib/api-zod

      - name: Run Phase C live HTTP security proof
        working-directory: artifacts/api-server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mustashark_test
          SESSION_SECRET: phase-c-isolated-test-secret
          NODE_ENV: test
        run: pnpm exec tsx --test src/security/phaseC.notifications.live-http.test.ts

      - name: Typecheck API server
        run: pnpm --filter @workspace/api-server typecheck
