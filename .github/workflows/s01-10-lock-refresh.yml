name: S01-10 lock refresh

on:
  push:
    branches:
      - codex/s01-10-security-edge-cases

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/s01-10-security-edge-cases
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit refreshed lockfile and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/s01-10-lock-refresh.yml
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No lockfile changes required"
            exit 0
          fi
          git commit -m "chore(S01-10): refresh pnpm lockfile"
          git push origin codex/s01-10-security-edge-cases
