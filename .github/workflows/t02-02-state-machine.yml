name: T02-02 Dispute State Machine

on:
  push:
    branches:
      - feat/t02-02-state-machine-clean
  workflow_dispatch:

permissions:
  contents: read

jobs:
  state-machine:
    name: T02-02 isolated PostgreSQL state machine gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mustashark_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mustashark_test"
          --health-interval 2s --health-timeout 2s --health-retries 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Production DB Guard
        run: bash scripts/security/forbid-production-db-mutations.sh

      - name: Provision isolated Synthetic/Test DB
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mustashark_test
        run: pnpm --filter @workspace/db push

      - name: Verify T02-02 database guards
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mustashark_test
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            constraint_count integer;
            trigger_count integer;
          BEGIN
            SELECT count(*) INTO constraint_count
            FROM pg_constraint c
            JOIN pg_class t ON t.oid = c.conrelid
            WHERE t.relname = 'disputes'
              AND c.conname IN ('disputes_version_positive_ck', 'disputes_closed_outcome_ck');

            IF constraint_count <> 2 THEN
              RAISE EXCEPTION 'T02-02 DB CHECK guard verification failed: expected 2, got %', constraint_count;
            END IF;

            SELECT count(*) INTO trigger_count
            FROM pg_trigger tr
            JOIN pg_class t ON t.oid = tr.tgrelid
            WHERE t.relname = 'disputes'
              AND tr.tgname = 'disputes_state_machine_guard'
              AND NOT tr.tgisinternal;

            IF trigger_count <> 1 THEN
              RAISE EXCEPTION 'T02-02 DB terminal/state-machine trigger verification failed: expected 1, got %', trigger_count;
            END IF;
          END
          $$;
          SQL

      - name: Typecheck workspace
        run: pnpm run typecheck

      - name: Build API server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mustashark_test
        run: pnpm --filter @workspace/api-server build

      - name: Run T02-02 isolated state machine tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mustashark_test
        run: pnpm --filter @workspace/api-server test:t02-02
